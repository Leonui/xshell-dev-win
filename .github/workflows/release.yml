name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target universal-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Linux apt packages
        if: matrix.platform == 'ubuntu-22.04'
        uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          packages: libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev libssl-dev
          version: 1.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      # Shared with Quality Gate: the default key is job-scoped, so the two workflows never
      # reused each other's cache. cache-on-failure keeps one failed platform from forcing
      # the next release to rebuild everything.
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          shared-key: tauri
          cache-on-failure: true

      # actions/cache fails its save step when none of the paths exist, and Tauri only
      # creates the platform's cache directory if its bundler has a tool to download.
      - name: Prepare Tauri tools cache directories
        shell: bash
        run: |
          mkdir -p ~/.cache/tauri
          mkdir -p ~/Library/Caches/tauri
          mkdir -p ~/AppData/Local/tauri

      # Tauri downloads WiX/NSIS and the AppImage helpers into the OS cache dir; cache them
      # instead of fetching them on every release.
      - name: Cache Tauri bundler tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/tauri
            ~/Library/Caches/tauri
            ~/AppData/Local/tauri
          key: ${{ runner.os }}-tauri-bundler-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-tauri-bundler-

      # Rust formatting, tests and clippy are covered by Quality Gate for every push and tag;
      # repeating them on all three release platforms cost 5-9 minutes per job and never fed
      # the release build (different cargo profile). The standalone frontend build is also
      # redundant: tauri build runs beforeBuildCommand (npm run build) itself.
      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend tests
        run: npm test -- --run

      - name: Build, verify, and publish (Tauri)
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # Keep this defined even for a passwordless key so the signer does not prompt.
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # The wrapper verifies the exact updater artifacts before tauri-action can upload them.
          tauriScript: npm run tauri:verified
          # A `-verify` tag runs the full three-platform build without creating or updating a
          # release: tauri-action publishes whenever tagName is set, so leave it unset there.
          tagName: ${{ endsWith(github.ref_name, '-verify') && '' || 'v__VERSION__' }}
          releaseName: 'xshell v__VERSION__'
          releaseBody: |
            See the assets below to download and install this version.

            Binaries are not yet code-signed:
            - **Windows:** SmartScreen will warn — click *More info → Run anyway*.
            - **macOS:** right-click the app → *Open* (twice) on first launch.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Assert signed Windows package set
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $required = @(
            Get-Item 'src-tauri/target/release/xshell.exe' -ErrorAction Stop
            Get-ChildItem 'src-tauri/target/release/bundle/msi' -Filter '*.msi' -File | Select-Object -First 1
            Get-ChildItem 'src-tauri/target/release/bundle/msi' -Filter '*.msi.sig' -File | Select-Object -First 1
            Get-ChildItem 'src-tauri/target/release/bundle/nsis' -Filter '*.exe' -File | Select-Object -First 1
            Get-ChildItem 'src-tauri/target/release/bundle/nsis' -Filter '*.exe.sig' -File | Select-Object -First 1
          )
          if ($required.Count -ne 5 -or $required -contains $null) {
            throw 'Missing portable EXE, MSI, NSIS, or updater signature artifact.'
          }
          foreach ($artifact in $required) {
            if ($artifact.Length -le 0) { throw "Empty artifact: $($artifact.FullName)" }
          }

      # Upload the raw xshell.exe (portable build, no installer wrapper) so the
      # npm wrapper can fetch it directly without triggering a UAC install dialog.
      - name: Upload portable Windows binary
        if: matrix.platform == 'windows-latest' && !endsWith(github.ref_name, '-verify')
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.tauri.outputs.appVersion }}"
          cp src-tauri/target/release/xshell.exe "xshell_${VERSION}_x64.exe"
          gh release upload "v${VERSION}" "xshell_${VERSION}_x64.exe" --clobber
